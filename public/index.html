const CSS_TEXT = `:root{
  --accent:#8A2438;
  --accent-dark:#6E1C2D;
  --accent-light:#F3E6E9;
  --ink:#2B2320;
  --muted:#6B5F5A;
  --rule:#E4DAD5;
  --bg:#FBF7F5;
  --card:#FFFFFF;
  --good:#3F7A4E;
  --good-bg:#E7F2E9;
  --warn:#B4741E;
  --warn-bg:#FBEEDD;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
}
#root{max-width:1180px;margin:0 auto;padding:0 0 60px;}
a{color:inherit;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input[type=number]{font-family:inherit;font-size:14px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--card);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:20;
}
.brand{font-weight:700;font-size:16px;color:var(--accent);display:flex;align-items:baseline;gap:8px;}
.brand span{font-weight:400;font-size:12px;color:var(--muted);}
.channel-tabs{display:flex;gap:6px;}
.channel-tabs button{
  padding:8px 16px;border:1px solid var(--rule);background:var(--card);border-radius:8px;
  color:var(--muted);font-weight:600;
}
.channel-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.top-right{font-size:12px;color:var(--muted);}

.status-strip{
  padding:8px 20px;font-size:12.5px;display:flex;align-items:center;gap:10px;
}
.status-strip.readonly{background:var(--warn-bg);color:var(--warn);}
.status-strip.checking{background:#F3F0EE;color:var(--muted);}
.status-strip.ok{background:transparent;}
.dirty-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);
}
.dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);}

.subnav{display:flex;gap:6px;padding:14px 20px 0;}
.subnav button{
  padding:7px 14px;border:1px solid var(--rule);background:var(--card);border-radius:999px;
  color:var(--muted);font-weight:600;font-size:13px;
}
.subnav button.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent);}

.view-pad{padding:16px 20px 0;}

.week-nav,.month-nav{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;
}
.nav-arrow{
  width:30px;height:30px;border-radius:6px;border:1px solid var(--rule);background:#fff;
  color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;
}
.period-label{font-weight:700;font-size:15px;}
.this-week-btn{margin-left:auto;font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:5px 12px;}
.status-badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.status-badge.draft{background:var(--warn-bg);color:var(--warn);}
.status-badge.confirmed{background:var(--good-bg);color:var(--good);}

.group-section{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.group-head{
  display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--accent-light);
  cursor:pointer;user-select:none;
}
.group-rank{font-size:11px;color:var(--accent);font-weight:700;background:#fff;border-radius:5px;padding:2px 6px;}
.group-name{font-weight:700;flex:1;}
.group-sub{font-size:12px;color:var(--good);font-weight:700;}
.collapse-caret{color:var(--muted);font-size:12px;}

.item-table{width:100%;border-collapse:collapse;}
.item-table td{padding:8px 14px;border-top:1px solid var(--rule);}
.item-table td.name{width:60%;}
.item-table td.qtycell{text-align:right;width:22%;}
.item-table td.annual{text-align:right;color:var(--muted);font-size:12px;width:18%;}
.week-ref{color:var(--accent);font-weight:600;margin-bottom:2px;}
.item-table input[type=number]{
  width:96px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;text-align:right;
}
.item-table input[type=number]:disabled{background:#F3F0EE;color:var(--muted);}

.footer-bar{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:14px 16px;margin:14px 0;flex-wrap:wrap;
}
.grand-total{font-weight:700;font-size:15px;}
.grand-total b{color:var(--accent);font-size:18px;margin-left:4px;}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-weight:700;font-size:13px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.ghost{background:#fff;color:var(--muted);}
.spacer{flex:1;}

.memo-card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin:14px 0 24px;}
.memo-card-title{font-weight:700;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.memo-card textarea{
  width:100%;min-height:64px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;
  font-family:inherit;font-size:13.5px;resize:vertical;
}
.memo-actions{display:flex;align-items:center;gap:10px;margin-top:8px;}
.link-btn{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;text-decoration:underline;padding:0;}

.month-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.month-table th,.month-table td{padding:9px 12px;border-top:1px solid var(--rule);text-align:right;}
.month-table th{background:var(--accent-light);text-align:right;font-size:12px;color:var(--accent);}
.month-table td.name,.month-table th.name{text-align:left;}
.month-table tr.group-row td{background:#FAF6F4;font-weight:700;}
.month-weeks-note{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.week-chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;}
.week-chip.confirmed{border-color:var(--good);color:var(--good);}
.week-chip.draft{border-color:var(--warn);color:var(--warn);}

.grouporder-list{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.go-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--rule);}
.go-row:first-child{border-top:none;}
.go-rank{width:26px;font-weight:700;color:var(--accent);font-size:13px;}
.go-name{flex:1;font-weight:600;}
.go-count{font-size:12px;color:var(--muted);width:70px;text-align:right;}
.go-arrows button{width:26px;height:26px;border-radius:6px;border:1px solid var(--rule);background:#fff;}
.go-arrows button:disabled{opacity:.35;}
.go-bottom{display:flex;align-items:center;gap:12px;padding:14px 16px;}

.wide-table-wrap{max-height:70vh;overflow-y:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card);}
.wide-table{width:100%;border-collapse:collapse;}
.wide-table thead th{position:sticky;top:0;background:var(--accent-light);color:var(--accent);padding:9px 12px;text-align:left;font-size:12px;z-index:5;}
.wide-table thead th.qtycell{text-align:right;}
.wide-table td{padding:7px 12px;border-top:1px solid var(--rule);}
.wide-table td.qtycell{text-align:right;}
.wide-table td.annual{text-align:right;color:var(--muted);font-size:12px;}

.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(43,35,32,.45);z-index:50;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:20px 22px;width:560px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;}
.modal-title{font-weight:700;font-size:15px;margin-bottom:10px;}
.modal-filter{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;font-family:inherit;}
.modal-list{overflow-y:auto;flex:1;}
.modal-list-item{padding:10px 0;border-top:1px solid var(--rule);}
.modal-list-item:first-child{border-top:none;}
.modal-list-item .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
.modal-actions{display:flex;justify-content:flex-end;margin-top:12px;}
.empty-note{color:var(--muted);font-size:13px;padding:24px;text-align:center;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
}
.toast.show{opacity:1;}

.known-issue{background:var(--accent-light);color:var(--accent-dark);border-radius:10px;padding:10px 14px;font-size:12.5px;margin:14px 0;}

.ocr-dropzone{border:2px dashed var(--rule);border-radius:10px;padding:28px 20px;text-align:center;background:var(--card);margin-bottom:14px;}
.ocr-dropzone input[type=file]{display:none;}
.ocr-preview-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px;}
.ocr-preview-wrap img{max-width:260px;max-height:340px;border-radius:8px;border:1px solid var(--rule);object-fit:contain;}
.ocr-progress{font-size:13px;color:var(--muted);}
.ocr-progress-bar{height:6px;background:var(--rule);border-radius:999px;overflow:hidden;margin-top:6px;width:220px;}
.ocr-progress-bar>div{height:100%;background:var(--accent);transition:width .2s;}
.ocr-list{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.ocr-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule);flex-wrap:wrap;}
.ocr-row:first-child{border-top:none;}
.ocr-row select{flex:1 1 220px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font-family:inherit;}
.ocr-row input[type=number]{width:80px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;text-align:right;}
.ocr-row .raw{flex:1 1 240px;font-size:12px;color:var(--muted);}
.ocr-row .unmatched{color:var(--warn);font-weight:600;}

@media (max-width:720px){
  .topbar{flex-direction:column;align-items:flex-start;gap:8px;}
  .item-table td.annual{display:none;}
  .month-table th.annual,.month-table td.annual{display:none;}
}

.print-toolbar{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;
}
.print-sheet{
  background:#fff;border:1px solid var(--rule);border-radius:6px;padding:18mm 16mm;
  max-width:210mm;margin:0 auto 40px;box-shadow:0 2px 10px rgba(43,35,32,.08);
}
.print-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;}
.print-title{font-weight:700;font-size:19px;}
.print-sub{font-size:13px;color:var(--muted);}
.print-group{margin-bottom:14px;break-inside:avoid;}
.print-group-title{display:flex;align-items:center;gap:10px;background:var(--accent-light);padding:6px 10px;border-radius:6px;margin-bottom:4px;}
.print-group-title .rank{font-size:11px;color:var(--accent);font-weight:700;background:#fff;border-radius:5px;padding:2px 6px;}
.print-group-title .gname{font-weight:700;flex:1;}
.print-group-title .gtotal{font-size:12.5px;color:var(--muted);}
.print-table{width:100%;border-collapse:collapse;font-size:13px;}
.print-table td{padding:4px 8px;border-bottom:1px solid var(--rule);}
.print-table td.code{color:var(--muted);width:110px;font-size:11.5px;}
.print-table td.qty{text-align:right;width:80px;font-weight:700;}
.print-grand{border-top:2px solid var(--ink);margin-top:16px;padding-top:10px;text-align:right;font-weight:700;font-size:15px;}
.print-grand b{color:var(--accent);font-size:18px;margin-left:6px;}

@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  #root{max-width:none;padding:0;}
  .print-sheet{box-shadow:none;border:none;margin:0;max-width:none;padding:0;}
  @page{size:A4 portrait;margin:15mm;}
}

const MASTER = JSON.parse(document.getElementById('app-master').textContent);

let claudeArtifact = null;

const NAV = {

/* ---------- date helpers ---------- */
function pad2(n){ return String(n).padStart(2, '0'); }
function isoDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseIso(s){ const parts = s.split('-').map(Number); return new Date(parts[0], parts[1] - 1, parts[2]); }
function mondayOf(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const r = new Date(d);
  r.setDate(d.getDate() + diff);
  r.setHours(0, 0, 0, 0);
  return r;
}
function addDays(d, n){ const r = new Date(d); r.setDate(d.getDate() + n); return r; }
function monthKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
const DOW_JP = ['日', '月', '火', '水', '木', '金', '土'];
function fmtDateJp(d){ return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtWeekLabel(monday){
  const sunday = addDays(monday, 6);
  const tail = monday.getFullYear() === sunday.getFullYear()
    ? (sunday.getMonth() + 1) + '月' + sunday.getDate() + '日'
    : fmtDateJp(sunday);
  return fmtDateJp(monday) + '(' + DOW_JP[monday.getDay()] + ') 〜 ' + tail + '(' + DOW_JP[sunday.getDay()] + ')';
}
function fmtMonthLabel(monthKey){
  const parts = monthKey.split('-').map(Number);
  return parts[0] + '年' + parts[1] + '月';
}
function fmtInt(n){ return (n || 0).toLocaleString('ja-JP'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- state access helpers ---------- */
function chData(channel){ return STATE[channel]; }
function getWeek(channel, wk){ return chData(channel).weeks[wk] || { status: 'draft', qty: {}, memo: '' }; }
function ensureWeek(channel, wk){
  const c = chData(channel);
  if(!c.weeks[wk]) c.weeks[wk] = { status: 'draft', qty: {}, memo: '' };
  return c.weeks[wk];
}
function getMonth(channel, mk){ return chData(channel).months[mk] || { memo: '' }; }
function ensureMonth(channel, mk){
  const c = chData(channel);
  if(!c.months[mk]) c.months[mk] = { memo: '' };
  return c.months[mk];
}
function weekKeysInMonth(channel, monthKey){
  return Object.keys(chData(channel).weeks).filter(function(wk){ return monthKeyOf(parseIso(wk)) === monthKey; }).sort();
}
function groupedRetailProducts(){
  const order = STATE.retail.groupOrder;
  const byGroup = {};
  MASTER.retailProducts.forEach(function(p){ (byGroup[p.group] = byGroup[p.group] || []).push(p); });
  return order.map(function(g){ return { name: g, products: byGroup[g] || [] }; });
}
function weekGroupSubtotal(channel, wk, products){
  const q = getWeek(channel, wk).qty;
  return products.reduce(function(s, p){ return s + (q[p.code] || 0); }, 0);
}
function weekGrandTotal(channel, wk){
  const q = getWeek(channel, wk).qty;
  return Object.keys(q).reduce(function(s, k){ return s + (q[k] || 0); }, 0);
}
function monthGroupSubtotal(channel, monthKey, products){
  const wks = weekKeysInMonth(channel, monthKey);
  return products.reduce(function(s, p){
    return s + wks.reduce(function(s2, wk){ return s2 + (getWeek(channel, wk).qty[p.code] || 0); }, 0);
  }, 0);
}
function monthProductTotal(channel, monthKey, code){
  const wks = weekKeysInMonth(channel, monthKey);
  return wks.reduce(function(s, wk){ return s + (getWeek(channel, wk).qty[code] || 0); }, 0);
}
/* ---------- 実績参考（前年同期・前々年同期） ---------- */
function refWeekIso(wk, yearsBack){
  return isoDate(addDays(parseIso(wk), -364 * yearsBack));
}
function historyQty(code, wk, yearsBack){
  const hist = MASTER.salesHistory && MASTER.salesHistory.retail && MASTER.salesHistory.retail[code];
  if(!hist) return null;
  const refWk = refWeekIso(wk, yearsBack);
  const v = hist[refWk];
  return (typeof v === 'number') ? v : null;
}
function renderWeekRefHtml(code, wk){
  const y1 = historyQty(code, wk, 1);
  const y2 = historyQty(code, wk, 2);
  if(y1 === null && y2 === null) return '';
  const parts = [];
  if(y1 !== null) parts.push('前年' + fmtInt(y1) + '個');
  if(y2 !== null) parts.push('前々年' + fmtInt(y2) + '個');
  return '<div class="week-ref">参考（同時期実績）: ' + parts.join('／') + '</div>';
}
function monthGrandTotal(channel, monthKey){
  const wks = weekKeysInMonth(channel, monthKey);
  return wks.reduce(function(s, wk){ return s + weekGrandTotal(channel, wk); }, 0);
}
function upsertMemoLog(channel, kind, key, text){
  const c = chData(channel);
  const now = new Date().toISOString();
  const existing = c.memoLog.find(function(e){ return e.kind === kind && e.key === key; });
  if(existing){ existing.text = text; existing.savedAt = now; }
  else { c.memoLog.unshift({ kind: kind, key: key, text: text, savedAt: now }); }
  c.memoLog = c.memoLog.filter(function(e){ return e.text && e.text.trim() !== ''; });
  c.memoLog.sort(function(a, b){ return a.key < b.key ? 1 : -1; });
}

function renderStatusStrip(){
  let cls = 'ok', text = '';
  if(isReadOnly){ cls = 'readonly'; text = '⚠ このビューは閲覧のみです（保存はできません）。'; }

/* ---------- retail ---------- */
function renderRetailBody(){
  let out = '<div class="subnav no-print">' +
    '<button class="' + (NAV.view === 'weekly' ? 'active' : '') + '" onclick="navView(\'weekly\')">週次計画</button>' +

function renderRetailWeekly(){
  const wk = NAV.weekStart;
  const monday = parseIso(wk);
  const week = getWeek('retail', wk);
  const groups = groupedRetailProducts();
  let out = '<div class="week-nav">' +

          (isReadOnly ? 'disabled' : '') + ' oninput="onQtyInput(this,\'retail\',\'' + wk + '\',\'' + p.code + '\')"></td></tr>';
      });

  });

function renderRetailMonthly(){

  let out = '<div class="print-toolbar no-print">' +

/* ---------- OCR取込（写真の読み取りによる入力補助） ---------- */
function renderOcrView(channel){
  const products = channel === 'retail' ? MASTER.retailProducts : MASTER.wholesaleProducts;
  const o = NAV.ocr;
  let out = '<div class="known-issue">紙の伝票・注文書などをスマホで撮影して、数量の入力を補助する機能です。読み取り結果はあくまで目安なので、必ずこの画面で内容を確認してから反映してください（印刷された文字向けの機能で、手書きの精度は高くありません）。</div>';

  if(o.status === 'idle' || o.status === 'error'){
    out += '<div class="ocr-dropzone">' +
      '<div style="margin-bottom:10px;color:var(--muted);font-size:13px;">写真を選ぶか、その場で撮影してください</div>' +
      '<label class="btn primary ocr-pick-btn">写真を選ぶ／撮影する' +
        '<input type="file" accept="image/*" capture="environment" onchange="onOcrFileSelected(this,\'' + channel + '\')"></label>' +
      (o.status === 'error' ? '<div style="margin-top:10px;color:var(--warn);font-size:12.5px;">' + esc(o.errorMsg || '読み取りに失敗しました。もう一度お試しください。') + '</div>' : '') +
      '</div>';
    return out;
  }

  out += '<div class="ocr-preview-wrap">';
  if(o.previewUrl) out += '<img src="' + o.previewUrl + '" alt="撮影した写真">';
  out += '<div style="flex:1;min-width:220px;">';
  if(o.status === 'preview'){
    out += '<button class="btn primary" onclick="startOcrRecognition(\'' + channel + '\')">この写真を読み取る</button> ' +
      '<button class="btn ghost" onclick="resetOcr()">やり直す</button>';
  } else if(o.status === 'processing'){
    const pct = Math.round((o.progressPct || 0) * 100);
    out += '<div class="ocr-progress">読み取り中…（' + pct + '%）' +
      '<div class="ocr-progress-bar"><div style="width:' + pct + '%"></div></div></div>';
  } else if(o.status === 'review'){
    out += '<div style="color:var(--muted);font-size:12.5px;">' + o.rows.length + '行を検出しました。内容を確認し、必要に応じて商品・数量を修正してから反映してください。</div>';
  }
  out += '</div></div>';

  if(o.status === 'review'){
    if(!o.rows.length){
      out += '<div class="empty-note">数量らしき行を検出できませんでした。写真の向き・明るさを変えて撮り直すか、週次計画画面で直接入力してください。</div>' +
        '<div class="go-bottom"><button class="btn ghost" onclick="resetOcr()">やり直す</button></div>';
    } else {
      out += '<div class="ocr-list">';
      o.rows.forEach(function(row, i){
        out += '<div class="ocr-row">' +
          '<input type="checkbox" ' + (row.include ? 'checked' : '') + ' onchange="toggleOcrRowInclude(' + i + ')">' +
          '<select onchange="updateOcrRowField(' + i + ',\'matchedCode\',this.value,\'' + channel + '\')">' +
            '<option value=""' + (row.matchedCode ? '' : ' selected') + '>（商品を選択）</option>' +
            products.map(function(p){
              return '<option value="' + esc(p.code) + '"' + (p.code === row.matchedCode ? ' selected' : '') + '>' + esc(p.name) + '</option>';
            }).join('') +
          '</select>' +
          '<input type="number" min="0" inputmode="numeric" value="' + (row.qty === null ? '' : row.qty) + '" placeholder="数量" ' +
            'oninput="updateOcrRowField(' + i + ',\'qty\',this.value,\'' + channel + '\')">' +
          '<span class="raw">検出テキスト:「' + esc(row.rawLine) + '」' + (!row.matchedCode ? '<span class="unmatched"> ・候補なし</span>' : '') + '</span>' +
          '</div>';
      });
      out += '</div>';
      out += '<div class="go-bottom">' +
        '<button class="btn ghost" onclick="resetOcr()">やり直す</button>' +
        '<div class="spacer"></div>' +
        '<button class="btn primary" onclick="applyOcrRows(\'' + channel + '\')" ' + (isReadOnly ? 'disabled' : '') + '>チェックした内容を今週の入力欄に反映</button>' +
        '</div>';
    }
  }
  return out;
}
function onOcrFileSelected(input, channel){
  const file = input.files && input.files[0];
  if(!file) return;
  if(NAV.ocr.previewUrl) URL.revokeObjectURL(NAV.ocr.previewUrl);
  NAV.ocr.file = file;
  NAV.ocr.previewUrl = URL.createObjectURL(file);
  NAV.ocr.status = 'preview';
  NAV.ocr.rows = [];
  NAV.ocr.errorMsg = '';
  render();
}
function resetOcr(){
  if(NAV.ocr.previewUrl) URL.revokeObjectURL(NAV.ocr.previewUrl);
  NAV.ocr = { status: 'idle', file: null, previewUrl: null, progressPct: 0, rows: [], errorMsg: '' };
  render();
}
async function startOcrRecognition(channel){
  NAV.ocr.status = 'processing';
  NAV.ocr.progressPct = 0;
  render();
  try{
    if(typeof Tesseract === 'undefined'){
      throw new Error('OCRライブラリの読み込みに失敗しました（通信環境をご確認のうえ、もう一度お試しください）');
    }
    const worker = await Tesseract.createWorker('jpn+eng', 1, {
      logger: function(m){
        if(m && typeof m.progress === 'number'){
          NAV.ocr.progressPct = m.progress;
          const pct = Math.round(m.progress * 100);
          const bar = document.querySelector('.ocr-progress-bar > div');
          if(bar) bar.style.width = pct + '%';
          const label = document.querySelector('.ocr-progress');
          if(label) label.firstChild.textContent = '読み取り中…（' + pct + '%）';
        }
      },
    });
    const result = await worker.recognize(NAV.ocr.file);
    await worker.terminate();
    const text = (result && result.data && result.data.text) || '';
    const products = channel === 'retail' ? MASTER.retailProducts : MASTER.wholesaleProducts;
    NAV.ocr.rows = parseOcrLines(text, products);
    NAV.ocr.status = 'review';
    render();
  } catch(err){
    NAV.ocr.status = 'error';
    NAV.ocr.errorMsg = (err && err.message) || '読み取りに失敗しました。もう一度お試しください。';
    render();
  }
}
function toggleOcrRowInclude(i){
  const row = NAV.ocr.rows[i];
  if(!row) return;
  row.include = !row.include;
  render();
}
function updateOcrRowField(i, field, value, channel){
  const row = NAV.ocr.rows[i];
  if(!row) return;
  if(field === 'qty'){
    row.qty = value === '' ? null : Math.max(0, parseInt(value, 10) || 0);
  } else if(field === 'matchedCode'){
    row.matchedCode = value;
    const products = channel === 'retail' ? MASTER.retailProducts : MASTER.wholesaleProducts;
    const p = products.find(function(pp){ return pp.code === value; });
    row.matchedName = p ? p.name : '';
    if(value) row.include = true;
  }
  render();
}
function applyOcrRows(channel){
  const wk = NAV.weekStart;
  const week = ensureWeek(channel, wk);
  let count = 0;
  NAV.ocr.rows.forEach(function(row){
    if(row.include && row.matchedCode && row.qty !== null && row.qty !== undefined){
      week.qty[row.matchedCode] = row.qty;
      count++;
    }
  });
  if(count > 0) dirty = true;
  if(NAV.ocr.previewUrl) URL.revokeObjectURL(NAV.ocr.previewUrl);
  NAV.ocr = { status: 'idle', file: null, previewUrl: null, progressPct: 0, rows: [], errorMsg: '' };
  NAV.view = 'weekly';
  render();
  showToast(count > 0
    ? '✓ ' + count + '件を今週の入力欄に反映しました。内容を確認して保存してください。'
    : '反映する行がありませんでした。チェック・商品・数量を確認してください。');
}

/* ---------- OCR: text extraction & fuzzy product matching (pure functions) ---------- */
function toHalfWidthDigits(s){
  return s.replace(/[０-９]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
}
function normalizeForMatch(s){
  return toHalfWidthDigits(s)
    .replace(/[\s　]+/g, '')
    .replace(/[・、。,.\-‐－()（）\[\]【】]/g, '')
    .toLowerCase();
}
function extractQtyFromLine(line){
  const norm = toHalfWidthDigits(line);
  const m = norm.match(/([0-9]+)\s*(?:個|袋|本|枚|箱|セット|kg|ｋｇ|g|ｇ)?\s*$/);
  if(!m) return null;
  const qty = parseInt(m[1], 10);
  const namePart = norm.slice(0, norm.length - m[0].length).trim();
  return { qty: qty, namePart: namePart };
}
function bigrams(s){
  const arr = [];
  for(let i = 0; i < s.length - 1; i++) arr.push(s.slice(i, i + 2));
  return arr;
}
function diceCoeff(a, b){
  if(a === b && a.length > 0) return 1;
  const A = bigrams(a), B = bigrams(b);
  if(A.length === 0 || B.length === 0) return 0;
  const pool = B.slice();
  let matches = 0;
  for(let i = 0; i < A.length; i++){
    const idx = pool.indexOf(A[i]);
    if(idx !== -1){ matches++; pool.splice(idx, 1); }
  }
  return (2 * matches) / (A.length + B.length);
}
function bestProductMatch(text, products){
  const norm = normalizeForMatch(text);
  if(!norm) return null;
  let best = null, bestScore = 0;
  for(let i = 0; i < products.length; i++){
    const p = products[i];
    const score = diceCoeff(norm, normalizeForMatch(p.name));
    if(score > bestScore){ bestScore = score; best = p; }
  }
  if(!best) return null;
  return { code: best.code, name: best.name, score: bestScore };
}
function parseOcrLines(text, products){
  const lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
  return lines.map(function(line){
    const extracted = extractQtyFromLine(line);
    const qty = extracted ? extracted.qty : null;
    const namePart = extracted ? extracted.namePart : line;
    const match = bestProductMatch(namePart, products);
    return {
      rawLine: line,
      qty: qty,
      matchedCode: match ? match.code : '',
      matchedName: match ? match.name : '',
      score: match ? match.score : 0,
      include: !!(match && qty !== null && match.score >= 0.3),
    };
  });
}

function moveGroupUp(name){

}
function moveGroupDown(name){
  const arr = STATE.retail.groupOrder; const i = arr.indexOf(name);
  if(i < arr.length - 1){ const tmp = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = tmp; dirty = true; render(); }
}
function resetGroupOrder(){ STATE.retail.groupOrder = MASTER.groupOrder.slice(); dirty = true; render(); }
async function saveGroupOrder(){ await publishState(); }

async function saveDraft(channel){ await publishState(); }
async function toggleConfirm(channel){
  const wk = NAV.weekStart;
  const w = ensureWeek(channel, wk);
  w.status = w.status === 'confirmed' ? 'draft' : 'confirmed';
  dirty = true;
  render();
  await publishState();
}
async function saveMemo(channel, kind, key, inputId){
  const text = document.getElementById(inputId).value;
  if(kind === 'week'){ ensureWeek(channel, key).memo = text; }
  else { ensureMonth(channel, key).memo = text; }
  upsertMemoLog(channel, kind, key, text);
  dirty = true;
  await publishState();
}

/* ---------- save / publish ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
async function ensureBackend(){
  if(backendMode !== 'checking') return backendMode;
  try{
    claudeArtifact = (typeof window.claude !== 'undefined' && window.claude.use) ? await window.claude.use('artifact') : null;
  } catch(e){ claudeArtifact = null; }
  if(claudeArtifact){
    backendMode = 'artifact';
    return backendMode;
  }
  /* not running inside the Claude artifact viewer — try the Netlify Functions backend */
  try{
    const res = await fetch('/api/state', { headers: { 'accept': 'application/json' } });
    if(res.ok){
      const data = await res.json();
      backendMode = 'netlify';
      if(data && data.state){
        STATE = data.state;
        stateVersion = data.version || 0;
        render();
      }
      return backendMode;
    }
  } catch(e){ /* no backend reachable — fall through to 'none' */ }
  backendMode = 'none';
  return backendMode;
}
function buildHtml(state){
  const masterJson = JSON.stringify(MASTER).replace(/</g, '\\u003c');
  const stateJson = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>紀の里 製造予定</title>\n</head>\n<body>\n' +
    '<div id="root"></div>\n<div class="toast" id="toast"></div>\n' +
    '<script id="app-master" type="application/json">' + masterJson + '<' + '/script>\n' +
    '<script id="app-state" type="application/json">' + stateJson + '<' + '/script>\n' +
    '<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"><' + '/script>\n' +
    '<script>' + APP_SCRIPT_SOURCE + '<' + '/script>\n' +
    '</body>\n</html>';
}
async function publishState(){
  if(backendMode === 'checking') await ensureBackend();

  if(backendMode === 'artifact'){
    try{
      const html = buildHtml(STATE);
      await claudeArtifact.publish(html);
      dirty = false;
      updateStatusStripInPlace();
      showToast('✓ 保存しました');
      return true;
    } catch(err){
      const code = err && err.code;
      let msg = '保存に失敗しました。もう一度お試しください。';
      if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
        isReadOnly = true;
        msg = 'このビューは閲覧のみです（保存できません）';
      } else if(code === 'conflict'){
        /* another view published first; the shell is already reloading this view */
        return false;
      } else if(code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed'){
        claudeArtifact = null;
        backendMode = 'none';
        msg = 'この画面では保存できません（プレビュー表示です）';
      }
      render();
      showToast(msg);
      return false;
    }
  }

  if(backendMode === 'netlify'){
    try{
      const res = await fetch('/api/state', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ state: STATE, expectedVersion: stateVersion }),
      });
      if(res.status === 409){
        const data = await res.json();
        STATE = data.state || STATE;
        stateVersion = data.version || stateVersion;
        dirty = false;
        render();
        showToast('他の方が先に保存したため、最新の内容を読み込み直しました。もう一度入力してください。');
        return false;
      }
      if(!res.ok){
        showToast('保存に失敗しました。もう一度お試しください。');
        return false;
      }
      const data = await res.json();
      stateVersion = (data && data.version) || (stateVersion + 1);
      dirty = false;
      updateStatusStripInPlace();
      showToast('✓ 保存しました');
      return true;
    } catch(err){
      showToast('保存に失敗しました（通信エラー）。もう一度お試しください。');
      return false;
    }
  }

  updateStatusStripInPlace();
  showToast('この画面では保存できません（プレビュー表示です）');
  return false;
}

/* ---------- init ---------- */
(function init(){
  const today = new Date();
  NAV.weekStart = isoDate(mondayOf(today));
  NAV.monthKey = monthKeyOf(today);
  render();
  ensureBackend().then(function(){ updateStatusStripInPlace(); });
})();
